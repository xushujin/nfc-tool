name: Android CI

# 触发条件：**只有推 tag 才会跑**（形如 v1.0.0）→ 校验 + 构建签名 release + 发布 GitHub Release。
# 推普通分支 / 提 PR 不触发任何构建。
# 需要手动跑一次时，到 Actions 页面点 "Run workflow"（workflow_dispatch）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 发布 Release 需要写 contents 权限
permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 校验任务：所有分支与 PR 都跑，不涉及签名材料
  # ---------------------------------------------------------------------------
  verify:
    name: 静态检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 不使用 android-actions/setup-android：
      # GitHub 的 ubuntu runner 已预装完整 Android SDK（含 cmdline-tools / build-tools / apksigner），
      # 自行装那一套反而容易踩到已下线的 legacy 包。这里只用 runner 自带的 sdkmanager
      # 补齐本工程需要的组件 —— 已装过就是空操作。AGP 在缺失时也会自动下载，这里是显式兜底。
      - name: 准备 Android SDK 组件
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKMANAGER"
          # 先接受许可，否则安装会卡在交互式确认上
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" \
            "build-tools;37.0.0" "build-tools;36.0.0"

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 发布任务：仅在推 tag 时执行
  # ---------------------------------------------------------------------------
  release:
    name: 构建并发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    # 测试 / Lint 不过就不发版：verify 失败时 release 直接跳过
    needs: verify
    runs-on: ubuntu-latest
    # 密钥放在 job 级 env：GitHub Actions 的 if: 表达式里不能引用 secrets，
    # 但 env 可以，这样「有没有配密钥」的判断能写在脚本里而不是 if 里。
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      NFC_TOOL_STORE_PASSWORD: ${{ secrets.NFC_TOOL_STORE_PASSWORD }}
      NFC_TOOL_KEY_ALIAS: ${{ secrets.NFC_TOOL_KEY_ALIAS }}
      NFC_TOOL_KEY_PASSWORD: ${{ secrets.NFC_TOOL_KEY_PASSWORD }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 准备 Android SDK 组件
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" \
            "build-tools;37.0.0" "build-tools;36.0.0"

      - name: 校验 tag 与 versionName 一致
        run: |
          set -euo pipefail
          # 只认「行首（可含缩进）versionName = "x.y.z"」这种赋值。
          # 不能用 `grep -m1 versionName`：注释里出现 versionName 也会被抓到，
          # 曾因此把注释文本当成版本号，导致 tag 校验直接失败。
          VERSION_NAME=$(sed -nE \
            's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
            app/build.gradle.kts | head -1)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::未能从 app/build.gradle.kts 解析出 versionName（期望形如 versionName = \"1.0.0\"）"
            exit 1
          fi
          echo "versionName=$VERSION_NAME  tag=$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 build.gradle.kts 中的 versionName $VERSION_NAME 不一致"
            echo "::error::请先把 versionName 改成与 tag 匹配的值并提交，再重新打 tag。"
            exit 1
          fi

      - name: 校验签名材料
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::仓库缺少 KEYSTORE_BASE64 Secret，拒绝用临时密钥出包。"
            echo "::error::配置方式见 README「签名」章节。"
            exit 1
          fi
          for name in NFC_TOOL_STORE_PASSWORD NFC_TOOL_KEY_ALIAS NFC_TOOL_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少环境变量 $name（对应仓库 Secret 同名项）"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$NFC_TOOL_STORE_PASSWORD" -alias "$NFC_TOOL_KEY_ALIAS" > /dev/null
          echo "签名库可用，别名 $NFC_TOOL_KEY_ALIAS 存在。"

      - name: 构建 release
        env:
          NFC_TOOL_STORE_FILE: ${{ runner.temp }}/release.jks
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 校验签名指纹
        env:
          NFC_TOOL_STORE_FILE: ${{ runner.temp }}/release.jks
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: 整理产物（文件名保持纯 ASCII）
        run: |
          set -euo pipefail
          # tag 里可能含非 ASCII 字符，GitHub Release 会因此丢文件名，这里统一过滤
          SAFE_TAG=$(printf '%s' "$GITHUB_REF_NAME" | tr -cd 'A-Za-z0-9._-')
          if [ -z "$SAFE_TAG" ]; then SAFE_TAG="release"; fi
          mkdir -p artifacts
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" "artifacts/nfc-tool-${SAFE_TAG}.apk"
          (cd artifacts && sha256sum "nfc-tool-${SAFE_TAG}.apk" > "nfc-tool-${SAFE_TAG}.apk.sha256")
          ls -l artifacts

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 允许重新打同一个 tag：Release 已存在时改为覆盖上传产物，而不是直接失败
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，覆盖上传产物。"
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              artifacts/*
          fi
